version: '3.8'

services:
  portal:
    build: .
    command: python launcher.py --portal --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  task1-extractor:
    build: .
    command: python task1-json-extractor/app.py --serve --port 8001
    ports:
      - "8001:8001"
    restart: unless-stopped
    env_file:
      - .env

  task2-rag:
    build: .
    command: python task2-document-rag/app.py --serve --port 8002
    ports:
      - "8002:8002"
    restart: unless-stopped
    env_file:
      - .env

  task4-chatbot:
    build: .
    command: streamlit run task4-streamlit-chatbot/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    restart: unless-stopped
    env_file:
      - .env
